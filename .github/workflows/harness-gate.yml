name: harness-gate

# smart-textbook-team 编排质量门禁（evo-16 接入；P0 阶段扩至 4 道，2026-10-15）:
#   1) router 离线评测      命中率 >= 0.80 (40 用例, SSOT 解析自 skill §1; P2-3 扩容)
#   2) 静态契约评测        总分须 >= 0.99 (199 计分项; E1c 已降级为不计分环境项)
#                          —— 阈值从 0.95 上调: E1c 解耦后 1.000 可达,
#                             0.99 仅容忍约 1 项偶发失败, 2 项及以上必红
#   3) shared-core 分发门禁  vendor 兜底副本与清单自洽 + git-clone 态冒烟
#                          (V4 防漂移在 CI 无联邦 core 时自动 SKIP)
#   4) 跨平台清单同步门禁   两份 plugin.json 必一致字段 + install.sh 技能覆盖
#   5) install.sh 语法/干跑冒烟（防安装脚本腐化）
#   6) package_release.sh 打包冒烟（防导出 zip 长期过期）
#   7) 书稿交付链冒烟（build_manuscript + check_manuscript；2026-10-30 新增）
#   8) 相位一致性门禁         PHASE_ORDER 唯一权威，文档只许引用不许复述（ADR-04，2026-11-01）
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  harness-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 相位一致性门禁（ADR-04 状态机归一，2026-11-01 批次 B1）
      # 病史：PHASE_ORDER 是唯一权威枚举，却被四份文档给出四种描述；R4/R5 记在
      # VERIFY 前缀下且全包 0 处写入（僵尸态）→ 续跑按顺序推进必然卡死。
      # 现把「文档与权威源一致」做成机械判据：不一致 exit 1 并列出 文件:行号:错误值 → 正确值。
      - name: 相位一致性门禁（PHASE_ORDER 唯一权威）
        run: python3 scripts/check_phase_consistency.py --root . --verbose

      # 学科中立性门禁（ADR-02 判据层学科化，2026-11-01 批次 B3）：
      # 五项判据执行体（术语表/八要素/审查基准/数值触发词/跨章正则）已下沉 profile，
      # 通用层只许「引用 profile」。本门禁禁止学科常量词回潮进通用层
      # （agents/skills/scripts/references，排除 profiles/ 与 *.example.md）+ 硬编码绝对路径。
      # 正向：0 命中；负向：把「禽流感」写回 scripts/ 的 .py 字符串字面量 → 必须 exit≠0。
      - name: 学科中立性门禁（check_domain_neutral.py 正负双向）
        run: |
          set -e
          python3 scripts/check_domain_neutral.py --root .
          printf 'X = "禽流感回潮探针"\n' > scripts/_leak_probe.py
          if python3 scripts/check_domain_neutral.py --root . 2>/dev/null; then
            echo "::error::负向失败：学科常量词写回通用层未被门禁拦截"
            rm -f scripts/_leak_probe.py
            exit 1
          fi
          rm -f scripts/_leak_probe.py
          echo "[OK] 学科中立性门禁正负双向通过"

      - name: Router 离线评测 (>= 0.80)
        run: python3 tests/test_router_eval.py

      - name: 静态契约评测 (>= 0.99)
        run: |
          python3 tests/test_smart_textbook_team.py
          SCORE=$(python3 tests/test_smart_textbook_team.py --json | python3 -c "import json,sys; print(json.load(sys.stdin)['score'])")
          echo "静态契约总分: $SCORE"
          python3 -c "import sys; sys.exit(0 if float('$SCORE') >= 0.99 else 1)"

      - name: shared-core 分发与防漂移门禁
        run: python3 tests/test_vendor_core.py

      - name: 跨平台清单同步门禁
        run: python3 tests/test_manifest_sync.py

      - name: install.sh 干跑冒烟（--dry-run，无副作用）
        run: |
          bash install.sh --lint-ps1
          bash install.sh --dry-run --target all

      # 打包脚本冒烟（2026-10-15）：zip 曾停在 2.0.0 一个月无人发现——
      # 这里验证 package_release.sh 自身可跑（CI 内无既有 zip，只验 build 分支退出码）
      - name: package_release.sh 打包冒烟（导出物不入库，仅验脚本可跑）
        run: bash scripts/package_release.sh /tmp/stt-smoke.zip

      # 书稿交付链依赖（pandoc / python-docx）：ubuntu-latest 默认不带。
      # 脚本在硬依赖缺失时 exit 3 硬失败（不静默降级成"没有 docx 也算过"），
      # 因此 CI 必须先装。与本机装法（brew install pandoc && pip install python-docx）等价。
      - name: 安装书稿链依赖（pandoc / python-docx）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc
          python3 -m pip install --quiet python-docx

      # 书稿交付链冒烟（2026-10-30 第 7 道门禁；v2.3.0 扩展：修订态往返回归）：
      # md→docx 构建 + 门禁 4 校验 + 修订标记→Word 真修订（--revisions）+ 回流（--apply-revisions）。
      # CI 内 mmdc/Chrome 通常不可用 → 栅格化按设计降级为占位框，脚本仍须 exit 0。
      # 判据：构建 exit 0 且 docx/审阅版落盘；--strict 全 pass；回流 accept 后标记清零。
      - name: 书稿交付链冒烟（build_manuscript + check_manuscript + 修订往返）
        run: |
          set -e
          WR=/tmp/stt-ms
          rm -rf "$WR"; mkdir -p "$WR/章节/ch01/figures/assets" "$WR/章节/ch01/review" "$WR/交付"
          cat > "$WR/章节/ch01/draft.md" <<'MD'
          ---
          教材名: 教材
          章节号: ch01
          章节标题: CI 冒烟章
          字数目标: 71
          实际净字数: 71
          版本: R3
          学科profile: veterinary
          ---

          # 第1章 CI 冒烟章

          ## 1.1 概述

          本句为冒烟正文 [实]（PMID:38960123）。交叉引用 [见 §1.2]。[原表述]{.deletion author="严正词" date="2026-10-31"}[修订表述]{.insertion author="严正词" date="2026-10-31"}

          ## 1.2 小结

          结论句 [实]（PMID:38960123）。

          ## 校稿结论

          - **结论**：可交付
          - **修订计数**：插入 1 处 / 删除 1 处
          - **遗留待办**：无

          ## 参考文献

          [1] 作者. 题名[J]. 刊名, 2020, 1(1): 1-2. (PMID:38960123)
          MD
          cat > "$WR/章节/ch01/review/r3_verification_log.md" <<'MD'
          | 位置 | 标识符 | 结果 | 动作 |
          |------|--------|------|------|
          | §1.1 | PMID:38960123 | 通过 | 保留 |
          | §1.2 | PMID:38960123 | 通过 | 保留 |
          MD
          # 单次调用即可（原实现带 `|| 再跑一次` 的兜底，掩盖真实失败原因且拖慢 CI）
          python3 scripts/build_manuscript.py --work-root "$WR" --chapter ch01 --assemble --revisions \
            --report "$WR/build_report.json"
          test -f "$WR/交付/教材_ch01.docx"
          test -f "$WR/交付/教材_ch01_审阅.docx"
          test -f "$WR/交付/教材_ch01.溯源.md"
          python3 scripts/check_manuscript.py --work-root "$WR" --chapter ch01 --strict
          # 修订往返回归：Word 修订（w:ins/w:del）真实存在 + 回流 accept 后标记清零
          WR="$WR" python3 - <<'PY'
          import os, zipfile
          p = os.path.join(os.environ["WR"], "交付", "教材_ch01_审阅.docx")
          xml = zipfile.ZipFile(p).read("word/document.xml").decode()
          assert "<w:ins " in xml and "<w:del " in xml, "审阅版无 Word 修订态（方案甲断柱）"
          PY
          python3 scripts/build_manuscript.py --work-root "$WR" --chapter ch01 \
            --apply-revisions --from-docx "$WR/交付/教材_ch01_审阅.docx" --revision-mode accept
          grep -q "修订表述" "$WR/交付/教材_ch01.md"
          # 铁律回归：改而不回流 = 分叉。回流后必须重建 docx，strict 须重新全过
          python3 scripts/build_manuscript.py --work-root "$WR" --chapter ch01 --assemble
          python3 scripts/check_manuscript.py --work-root "$WR" --chapter ch01 --strict

      # 数据图执行级门禁（P2-4，2026-11-01）：4.10 的「可执行」此前只是人工承诺——
      # 结构查得像契约，但语法错/缺依赖/导出路径错一律查不出。现真跑 notebook。
      # 双向：合规 notebook 必须 exit 0；导出路径写错的必须被 4.10e 拦住。
      - name: 数据图执行级门禁（4.10e 正负双向）
        run: |
          set -e
          # nbconvert + ipykernel 是「真执行」档的前提；matplotlib 供绘图 cell
          python3 -m pip install --quiet nbconvert nbformat ipykernel matplotlib
          WR=/tmp/stt-ms
          # ① 往冒烟稿里加一个数据图位（数据来源非「纯示意」）+ 对应 4-cell notebook
          WR="$WR" python3 - <<'PY'
          import json, os, pathlib
          wr = pathlib.Path(os.environ["WR"])
          draft = wr / "章节/ch01/draft.md"
          txt = draft.read_text(encoding="utf-8")
          slot = ("[图 1-1：冒烟趋势｜教学目的：验证执行级校验｜数据来源：内联样例数据]\n\n"
                  "图 1-1 冒烟趋势\n\n")
          txt = txt.replace("## 1.2 小结", slot + "## 1.2 小结", 1)
          draft.write_text(txt, encoding="utf-8")
          nb = {
              "cells": [
                  {"cell_type": "markdown", "metadata": {}, "source": ["# 图 1-1 冒烟趋势\n", "教学目的：验证 4.10e\n"]},
                  {"cell_type": "code", "metadata": {}, "execution_count": None, "outputs": [],
                   "source": ["# 内联数据\n", "DATA = [1, 2, 3, 2, 4]\n"]},
                  {"cell_type": "code", "metadata": {}, "execution_count": None, "outputs": [],
                   "source": ["import matplotlib\n", "matplotlib.use('Agg')\n",
                              "import matplotlib.pyplot as plt\n",
                              "fig, ax = plt.subplots(figsize=(4, 2))\n",
                              "ax.plot(DATA)\n", "ax.set_title('smoke')\n"]},
                  {"cell_type": "code", "metadata": {}, "execution_count": None, "outputs": [],
                   "source": ["fig.savefig('1-1.pdf')\n", "fig.savefig('1-1.png', dpi=120)\n",
                              "print('exported')\n"]},
              ],
              "metadata": {"kernelspec": {"name": "python3", "display_name": "Python 3",
                                         "language": "python"}},
              "nbformat": 4, "nbformat_minor": 5,
          }
          p = wr / "章节/ch01/figures/assets/1-1.ipynb"
          p.write_text(json.dumps(nb, ensure_ascii=False), encoding="utf-8")
          print("fixture ready:", p)
          PY
          # ② 先装配一次：check_manuscript 读的是「交付 md」，草稿改完必须装配才可见
          python3 scripts/build_manuscript.py --work-root "$WR" --chapter ch01 --assemble
          # ②' 插槽会改变净字数 → 按实测值回写 frontmatter 字数目标（4.7 容忍 ±5%），
          #     否则本步会因为「夹具字数」而非「执行能力」变红（假信号）
          NW=$(python3 scripts/count_net_words.py "$WR/交付/教材_ch01.md" --json \
               | python3 -c "import json,sys; print(json.load(sys.stdin)['net'])")
          WR="$WR" NW="$NW" python3 - <<'PY'
          import os, pathlib, re
          p = pathlib.Path(os.environ["WR"]) / "章节/ch01/draft.md"
          txt = p.read_text(encoding="utf-8")
          n = os.environ["NW"]
          txt = re.sub(r"^字数目标: .*$", f"字数目标: {n}", txt, flags=re.M)
          txt = re.sub(r"^实际净字数: .*$", f"实际净字数: {n}", txt, flags=re.M)
          p.write_text(txt, encoding="utf-8")
          print("字数目标 →", n)
          PY
          python3 scripts/build_manuscript.py --work-root "$WR" --chapter ch01 --assemble
          # ③ 执行级校验（真跑并产出 1-1.png；此刻 docx 还没嵌图，故允许非 strict 失败）
          python3 scripts/check_manuscript.py --work-root "$WR" --chapter ch01 \
            --exec-notebooks --exec-timeout 180 || true
          test -f "$WR/章节/ch01/figures/assets/1-1.png"   # 执行真的产出了预览图
          # ④ 再装配让 4.6a 有图可嵌，然后全量 strict（含 4.10e）必须全过
          python3 scripts/build_manuscript.py --work-root "$WR" --chapter ch01 --assemble
          python3 scripts/check_manuscript.py --work-root "$WR" --chapter ch01 \
            --exec-notebooks --exec-timeout 180 --strict
          echo "[OK] 合规 notebook 执行级校验通过"
          # ③ 负向：导出路径指到不存在的目录 → 必须 FAIL（这是真实踩过的缺陷形态）
          WR="$WR" python3 - <<'PY'
          import json, os, pathlib
          p = pathlib.Path(os.environ["WR"]) / "章节/ch01/figures/assets/1-1.ipynb"
          d = json.loads(p.read_text(encoding="utf-8"))
          d["cells"][3]["source"] = ["fig.savefig('figures/assets/1-1.png')\n"]
          p.write_text(json.dumps(d, ensure_ascii=False), encoding="utf-8")
          PY
          if python3 scripts/check_manuscript.py --work-root "$WR" --chapter ch01 \
               --exec-notebooks --exec-timeout 180 --strict; then
            echo "::error::4.10e 未拦住执行失败的 notebook（导出路径错却判通过）"
            exit 1
          fi
          echo "[OK] 4.10e 拦住故障 notebook（正负双向通过）"

      # 负向实验（批次 H，2026-10-31：此前 4.10-4.13 声称「负向实验守护」但全仓无实体——
      # 回退判据改动 CI 不会红。现补 4 组破坏性用例，每组必须 FAIL 才算门禁有效）
      - name: 门禁4负向实验（4.10/4.11/4.12b/4.13a 必须拦住破坏样本）
        run: |
          set -e
          WR=/tmp/stt-ms-neg
          rm -rf "$WR"; mkdir -p "$WR/章节/ch01/figures/assets" "$WR/章节/ch01/review" "$WR/交付"
          cat > "$WR/章节/ch01/draft.md" <<'MD'
          ---
          教材名: 教材
          章节号: ch01
          章节标题: 负向实验章
          字数目标: 50
          实际净字数: 50
          版本: R3
          学科profile: veterinary
          ---

          # 第1章 负向实验

          ## 1.1 概述

          数据句 [实]（PMID:12345678）。禽流感（AI）缩写滥用。

          ## 参考文献

          [1] 作者. 题名[J]. 刊名, 2020, 1(1): 1-2. (PMID:12345678)
          MD
          cat > "$WR/章节/ch01/review/r3_verification_log.md" <<'MD'
          | 位置 | 标识符 | 结果 | 动作 |
          |------|--------|------|------|
          | §1.1 | PMID:12345678 | 通过 | 保留 |
          MD
          echo '结论: 可交付' > "$WR/章节/ch01/review/proofread_revisions.md"
          python3 scripts/build_manuscript.py --work-root "$WR" --chapter ch01 --assemble >/dev/null
          # 负向①：4.12b 伪造标识符（FAKE-DOI）→ 必须 FAIL
          sed -i 's/PMID:12345678/FAKE-DOI-999/' "$WR/交付/教材_ch01.溯源.md"
          if python3 scripts/check_manuscript.py --work-root "$WR" --chapter ch01 --strict 2>/dev/null; then
            echo "负向①FAIL: 伪造溯源标识符未被拦截"; exit 1
          fi
          echo "负向① PASS: 4.12b 拦截伪造标识符"
          # 负向②：4.13a 孤立插入标记 → 必须 FAIL
          python3 scripts/build_manuscript.py --work-root "$WR" --chapter ch01 --assemble >/dev/null
          python3 - <<'PY'
          p = "/tmp/stt-ms-neg/交付/教材_ch01.md"
          t = open(p, encoding="utf-8").read()
          t = t.replace("数据句 [实]（PMID:12345678）。", "数据句 [实]（PMID:12345678）。[凭空新句]{.insertion author=\"x\" date=\"2026-10-31\"}")
          open(p, "w", encoding="utf-8").write(t)
          PY
          if python3 scripts/check_manuscript.py --work-root "$WR" --chapter ch01 --strict 2>/dev/null; then
            echo "负向②FAIL: 孤立修订标记未被拦截"; exit 1
          fi
          echo "负向② PASS: 4.13a 拦截孤立插入"
          # 负向③：4.10 数据图位缺 notebook → 必须 FAIL
          python3 scripts/build_manuscript.py --work-root "$WR" --chapter ch01 --assemble >/dev/null
          python3 - <<'PY'
          p = "/tmp/stt-ms-neg/章节/ch01/draft.md"
          t = open(p, encoding="utf-8").read()
          t = t.replace("## 参考文献", "[图 1-1：发病率趋势｜教学目的：展示变化｜数据来源：检索摘要]\n\n图 1-1 发病率趋势\n\n## 参考文献")
          open(p, "w", encoding="utf-8").write(t)
          PY
          rm -rf "$WR/交付"; mkdir -p "$WR/交付"
          python3 scripts/build_manuscript.py --work-root "$WR" --chapter ch01 --assemble >/dev/null
          if python3 scripts/check_manuscript.py --work-root "$WR" --chapter ch01 --strict 2>/dev/null; then
            echo "负向③FAIL: 数据图缺 notebook 未被拦截"; exit 1
          fi
          echo "负向③ PASS: 4.10 拦截缺 notebook"
          # 负向④：4.11 禁用写法词界（AI 独立出现）→ 必须 FAIL
          python3 scripts/build_manuscript.py --work-root "$WR" --chapter ch01 --assemble >/dev/null
          if python3 scripts/check_manuscript.py --work-root "$WR" --chapter ch01 --strict 2>/dev/null; then
            echo "负向④FAIL: 禁用写法 AI 未被拦截"; exit 1
          fi
          echo "负向④ PASS: 4.11 拦截禁用写法"

      # 负向⑤⑥（ADR-03 逐处锚定，2026-11-01 批次 B2）：4.12d 修「空集恒真」——
      # 旧口径 [实] 不写标识符 → 正文标识符集合为空 → 恒 PASS（C-35 实测伪造合规结论）。
      # 现「有声明必有锚」是硬判据：裸 [实] 无锚、本地源缺 #锚 均须 FAIL，带 #锚 须 PASS。
      - name: 门禁4负向实验（4.12d 逐处锚定正负双向）
        run: |
          set -e
          WR2=/tmp/stt-ms-neg2
          rm -rf "$WR2"; mkdir -p "$WR2/章节/ch01/figures/assets" "$WR2/章节/ch01/review" "$WR2/交付"
          cat > "$WR2/章节/ch01/draft.md" <<'MD'
          ---
          教材名: 教材
          章节号: ch01
          章节标题: 锚定负向章
          字数目标: 30
          实际净字数: 30
          版本: R3
          学科profile: veterinary
          ---

          # 第1章 锚定负向

          ## 1.1 概述

          数据句 [实]。

          ## 参考文献

          [1] 作者. 题名[J]. 刊名, 2020, 1(1): 1-2. (PMID:12345678)
          MD
          cat > "$WR2/章节/ch01/review/r3_verification_log.md" <<'MD'
          | 位置 | 标识符 | 结果 | 动作 |
          |------|--------|------|------|
          | §1.1 | PMID:12345678 | 通过 | 保留 |
          MD
          echo '结论: 可交付' > "$WR2/章节/ch01/review/proofread_revisions.md"
          python3 scripts/build_manuscript.py --work-root "$WR2" --chapter ch01 --assemble >/dev/null
          # 负向⑤：4.12d 裸 [实] 无锚 → 必须 FAIL
          if python3 scripts/check_manuscript.py --work-root "$WR2" --chapter ch01 --strict 2>/dev/null; then
            echo "负向⑤FAIL: 裸 [实] 无锚未被 4.12d 拦截"; exit 1
          fi
          echo "负向⑤ PASS: 4.12d 拦截裸 [实] 无锚"
          # 负向⑥：4.12d 本地源缺 #锚（只给路径）→ 必须 FAIL
          python3 - <<'PY'
          p = "/tmp/stt-ms-neg2/章节/ch01/draft.md"
          t = open(p, encoding="utf-8").read()
          t = t.replace("数据句 [实]。", "数据句 [实]（本地:章节/ch01/fig/a.png）。")
          open(p, "w", encoding="utf-8").write(t)
          PY
          rm -rf "$WR2/交付"; mkdir -p "$WR2/交付"
          python3 scripts/build_manuscript.py --work-root "$WR2" --chapter ch01 --assemble >/dev/null
          if python3 scripts/check_manuscript.py --work-root "$WR2" --chapter ch01 --strict 2>/dev/null; then
            echo "负向⑥FAIL: 本地源缺 #锚 未被 4.12d 拦截"; exit 1
          fi
          echo "负向⑥ PASS: 4.12d 拦截本地源缺 #锚"
          # 正向后置⑦：本地源带 #锚 → 4.12d 必须 PASS（防误杀；只验 4.12d，不 --strict 全过）
          python3 - <<'PY'
          p = "/tmp/stt-ms-neg2/章节/ch01/draft.md"
          t = open(p, encoding="utf-8").read()
          t = t.replace("数据句 [实]（本地:章节/ch01/fig/a.png）。",
                        "数据句 [实]（本地:章节/ch01/fig/a.png#图1）。")
          open(p, "w", encoding="utf-8").write(t)
          PY
          rm -rf "$WR2/交付"; mkdir -p "$WR2/交付"
          python3 scripts/build_manuscript.py --work-root "$WR2" --chapter ch01 --assemble >/dev/null
          python3 scripts/check_manuscript.py --work-root "$WR2" --chapter ch01 --json 2>/dev/null > /tmp/stt-neg2.json || true
          python3 - <<'PY'
          import json
          items = {i["id"]: i for i in json.load(open("/tmp/stt-neg2.json"))["items"]}
          assert items.get("4.12d", {}).get("ok") is True, \
              "4.12d 本地源带 #锚 应 PASS，实际: " + str(items.get("4.12d"))
          print("负向⑦后置 PASS: 本地源带 #锚 通过 4.12d")
          PY

      # 4.14 硬门槛正负双向（ADR-05 批次 B4）：R5 评分机械化 + 打回计数 + 信封 19 字段
      # 量化标准（GATE2 §5）：total=79→FAIL；total=82 但权重和≠100→FAIL（防伪造）；
      # 同一问题打回 2 次 → reject-counts 达 2 且介入协议自动触发；--from-envelope 解析 19/19
      - name: 4.14 硬门槛正负双向（score_quality + reject-counts + 信封 19 字段）
        run: |
          set -e
          WR=/tmp/stt-r5
          rm -rf "$WR"; mkdir -p "$WR/运行态"
          cat > /tmp/stt-r5-ev.json <<'JSON'
          {"知识严谨性": ["§1.2 [实]（PMID:38960123）"],
           "前沿性": ["§1.1 引用近 10 年 90%"],
           "易懂易学": ["§1.1 案例锚点 3 处"],
           "职业教育适配": ["§1.2 岗课赛证对照表"],
           "规范性": ["4.11 术语表 0 违规"]}
          JSON
          # 正向①：score_quality 产出合格 r5-score.json → exit 0
          python3 scripts/score_quality.py --work-root "$WR" --chapter ch01 \
            --dim 知识严谨性=85 --dim 前沿性=80 --dim 易懂易学=85 \
            --dim 职业教育适配=80 --dim 规范性=80 \
            --evidence /tmp/stt-r5-ev.json | tee /tmp/stt-r5-out.txt
          grep -q "R5_VERDICT=pass" /tmp/stt-r5-out.txt
          python3 - <<'PY'
          import json
          d = json.load(open("/tmp/stt-r5/运行态/r5-score.json"))
          assert d["weight_sum"] == 100, d
          assert abs(d["total"] - 82.75) < 0.01, d["total"]
          assert d["verdict"] == "pass", d
          print("正向① PASS: score_quality 产出 total=%.2f weight_sum=100 verdict=pass" % d["total"])
          PY
          # 正向②：合格文件 → 4.14 放行
          python3 - <<'PY'
          import importlib.util as ilu, pathlib
          spec = ilu.spec_from_file_location("cm", "scripts/check_manuscript.py")
          cm = ilu.module_from_spec(spec); spec.loader.exec_module(cm)
          r = cm.Result()
          cm.check_r5_score(pathlib.Path("/tmp/stt-r5"), "ch01", r)
          bad = [i for i in r.items if not i["ok"] and i["level"] == "FAIL"]
          assert not bad, bad
          print("正向② PASS: 4.14 放行合格 r5-score.json")
          PY
          # 负向③：total=79（<80 红线）→ 4.14 必须 FAIL
          python3 - <<'PY'
          import json
          p = "/tmp/stt-r5/运行态/r5-score.json"
          d = json.load(open(p)); d["total"] = 79.0
          json.dump(d, open(p, "w"), ensure_ascii=False)
          PY
          python3 - <<'PY'
          import importlib.util as ilu, pathlib
          spec = ilu.spec_from_file_location("cm", "scripts/check_manuscript.py")
          cm = ilu.module_from_spec(spec); spec.loader.exec_module(cm)
          r = cm.Result()
          cm.check_r5_score(pathlib.Path("/tmp/stt-r5"), "ch01", r)
          m = {i["id"]: i for i in r.items}
          assert m["4.14d"]["ok"] is False, m.get("4.14d")
          print("负向③ PASS: total=79 被 4.14d 拦截")
          PY
          # 负向④：total=82 但权重和=90（伪造维度权重）→ 4.14 必须 FAIL
          python3 - <<'PY'
          import json
          p = "/tmp/stt-r5/运行态/r5-score.json"
          d = json.load(open(p)); d["total"] = 82.0; d["weight_sum"] = 90
          json.dump(d, open(p, "w"), ensure_ascii=False)
          PY
          python3 - <<'PY'
          import importlib.util as ilu, pathlib
          spec = ilu.spec_from_file_location("cm", "scripts/check_manuscript.py")
          cm = ilu.module_from_spec(spec); spec.loader.exec_module(cm)
          r = cm.Result()
          cm.check_r5_score(pathlib.Path("/tmp/stt-r5"), "ch01", r)
          m = {i["id"]: i for i in r.items}
          assert m["4.14b"]["ok"] is False, m.get("4.14b")
          print("负向④ PASS: 权重和≠100 被 4.14b 拦截（防伪造）")
          PY
          # 负向⑤：score_quality 每维证据缺失 → exit≠0（评分不可空口）
          python3 - <<'PY'
          import json
          ev = json.load(open("/tmp/stt-r5-ev.json")); ev["规范性"] = []
          json.dump(ev, open("/tmp/stt-r5-ev-bad.json", "w"), ensure_ascii=False)
          PY
          if python3 scripts/score_quality.py --work-root "$WR" --chapter ch01 \
            --dim 知识严谨性=85 --dim 前沿性=80 --dim 易懂易学=85 \
            --dim 职业教育适配=80 --dim 规范性=80 \
            --evidence /tmp/stt-r5-ev-bad.json 2>/dev/null; then
            echo "负向⑤FAIL: 证据缺失未被 score_quality 拦截"; exit 1
          fi
          echo "负向⑤ PASS: 每维证据缺失被 score_quality 拦截"
          # 负向⑥：手改 total 与 dims 不自洽（82 伪装）→ 4.14c 独立重算拦截
          python3 - <<'PY'
          import json
          p = "/tmp/stt-r5/运行态/r5-score.json"
          d = json.load(open(p))
          d["total"] = 82.0; d["weight_sum"] = 100   # dims 仍是 79 那组（重算=78.25）
          json.dump(d, open(p, "w"), ensure_ascii=False)
          PY
          python3 - <<'PY'
          import importlib.util as ilu, pathlib
          spec = ilu.spec_from_file_location("cm", "scripts/check_manuscript.py")
          cm = ilu.module_from_spec(spec); spec.loader.exec_module(cm)
          r = cm.Result()
          cm.check_r5_score(pathlib.Path("/tmp/stt-r5"), "ch01", r)
          m = {i["id"]: i for i in r.items}
          assert m["4.14c"]["ok"] is False, m.get("4.14c")
          print("负向⑥ PASS: total≠Σ(维度×权重)/100 被 4.14c 独立重算拦截")
          PY
          # 正向⑦：r5-score.json 不存在 → N/A 不阻塞（回退方式）
          rm -f "$WR/运行态/r5-score.json"
          python3 - <<'PY'
          import importlib.util as ilu, pathlib
          spec = ilu.spec_from_file_location("cm", "scripts/check_manuscript.py")
          cm = ilu.module_from_spec(spec); spec.loader.exec_module(cm)
          r = cm.Result()
          cm.check_r5_score(pathlib.Path("/tmp/stt-r5"), "ch01", r)
          bad = [i for i in r.items if not i["ok"] and i["level"] == "FAIL"]
          assert not bad, bad
          print("正向⑦ PASS: 缺 r5-score.json → 4.14 N/A 不阻塞")
          PY
          # 打回计数：同一 reject-key 两次 → 计数达 2，介入协议自动触发
          for i in 1 2; do
            python3 scripts/record_trace.py --work-root "$WR" \
              --task-id "ch01-VERIFY-R2-$i" --from quality-examiner --to team-lead \
              --type BLOCK --outcome BLOCKED \
              --reject-key "ch01|术语不一致" 2>/tmp/stt-reject-err.txt | tee /tmp/stt-reject-out.txt
          done
          grep -q "REJECT_COUNT=2" /tmp/stt-reject-out.txt
          grep -q "INTERVENTION_TRIGGERED=1" /tmp/stt-reject-out.txt
          python3 scripts/progress.py --work-root "$WR" rejects | tee /tmp/stt-rejects.txt
          grep -q "INTERVENTION=1" /tmp/stt-rejects.txt
          echo "打回计数 PASS: reject-counts 达 2 且介入协议自动触发（progress rejects 可查）"
          # 信封 19 字段全解析（A-09/A-26）
          cat > /tmp/stt-envelope.json <<'JSON'
          {"agent_id": "quality-examiner", "task_id": "ch01-VERIFY-R2",
           "phase": "VERIFY", "status": "partial", "confidence": 88,
           "deliverable_summary": "R1-R2 完成", "evidence": [{"type": "source", "ref": "PMID:38960123", "used_for": "3.1"}],
           "issues": ["术语2处不一致"], "next_agent_hint": "smart-textbook-team-team-lead",
           "metrics": {"duration_ms": 128000, "retry_count": 0},
           "msg_id": "ch01-VERIFY-R2-quality-examiner-1", "correlation_id": "ch01",
           "type": "RESULT", "from": "quality-examiner", "to": "smart-textbook-team-team-lead",
           "context_refs": ["章节/ch01/review/round2_report.md"],
           "state_patch": {"phase": "VERIFY-R2", "artifacts": {}, "blocking_open": []},
           "ts": "2026-11-01T12:00:00+00:00",
           "payload": {"core_output": "verdict: pass", "evidence_or_basis": "r3 log", "open_questions": []}}
          JSON
          python3 scripts/record_trace.py --work-root "$WR" --from-envelope /tmp/stt-envelope.json \
            --task-id ch01-VERIFY-R2 --from quality-examiner --to team-lead --type RESULT \
            2>/dev/null | tee /tmp/stt-env-out.txt
          grep -q "ENVELOPE_FIELDS_PARSED=19/19" /tmp/stt-env-out.txt
          python3 - <<'PY'
          import json
          lines = open("/tmp/stt-r5/运行态/trace.jsonl", encoding="utf-8").read().splitlines()
          rec = json.loads(lines[-1])
          env = rec.get("envelope", {})
          assert len(env) == 19, sorted(env)
          assert rec["confidence"] == 88 and rec["issues"] == ["术语2处不一致"], rec
          print("信封 PASS: ENVELOPE_FIELDS_PARSED=19/19 且 confidence/issues 同源落 trace")
          PY

      # CS 教材章跨学科端到端（ADR-02 判据层学科化，2026-11-01 批次 B3）：
      # 验证「非兽医学科也能跑通」的解耦证据——CS 术语表无 AI 禁用 → 4.11 放行
      # 「人工智能（AI）」；通用百分比数值信号（RE_PERCENT 兜底）→ 3.1 报缺标签
      # （旧实现写死 11 个兽医指标，非兽医学科的百分比数值恒绿，C-05 病灶）。
      - name: CS 教材章跨学科端到端（4.11 放行 + 3.1 缺标签 + 三 profile 断言）
        run: |
          set -e
          WR=/tmp/stt-cs
          rm -rf "$WR"; mkdir -p "$WR/章节/ch01/figures/assets" "$WR/章节/ch01/review" "$WR/交付"
          cat > "$WR/章节/ch01/draft.md" <<'MD'
          ---
          教材名: 计算机导论
          章节号: ch01
          章节标题: 人工智能概述
          字数目标: 60
          实际净字数: 60
          版本: R1
          学科profile: computer-science
          ---

          # 第1章 人工智能概述

          ## 1.1 概述

          人工智能（AI）是计算机科学的分支。

          ## 参考文献

          [1] 作者. 题名[J]. 刊名, 2020, 1(1): 1-2. (PMID:38960123)
          MD
          cat > "$WR/章节/ch01/review/r3_verification_log.md" <<'MD'
          | 位置 | 标识符 | 结果 | 动作 |
          |------|--------|------|------|
          | §1.1 | PMID:38960123 | 通过 | 保留 |
          MD
          echo '结论: 可交付' > "$WR/章节/ch01/review/proofread_revisions.md"
          python3 scripts/build_manuscript.py --work-root "$WR" --chapter ch01 --assemble >/dev/null
          # ① CS「人工智能（AI）」→ 4.11 必须 PASS（AI 非 CS 禁用写法；兽医域 AI 才是禁用）
          python3 scripts/check_manuscript.py --work-root "$WR" --chapter ch01 --json 2>/dev/null > /tmp/stt-cs.json || true
          python3 - <<'PY'
          import json
          items = {i["id"]: i for i in json.load(open("/tmp/stt-cs.json"))["items"]}
          assert items.get("4.11", {}).get("ok") is True, "CS 4.11 应放行 人工智能（AI）: " + str(items.get("4.11"))
          print("[OK] CS 4.11 放行 人工智能（AI）")
          PY
          # ② 3.1 通用百分比兜底：资产负债率 68.4% 无标签 → 节级自查必须报缺标签
          mkdir -p "$WR/章节/ch01/sections"
          printf '## 1.1 概述\n\n资产负债率 68.4%% 是财务指标示例（无标签）。\n' > "$WR/章节/ch01/sections/1.1.md"
          if python3 scripts/assemble_sections.py --work-root "$WR" --chapter ch01 2>/dev/null; then
            echo "::error::3.1 未拦截无标签百分比数值（68.4% 缺标签却通过节级自查）"
            exit 1
          fi
          echo "[OK] CS 3.1 拦截无标签百分比数值（RE_PERCENT 兜底）"
          # ③ 三 profile 均含 §5/§6/§7（节可标 N/A，但节必须存在）
          for f in references/profiles/veterinary.md references/profiles/computer-science.md references/profiles/law.md; do
            for s in "## 5" "## 6" "## 7"; do
              grep -q "$s" "$f" || { echo "::error::$f 缺 $s 节"; exit 1; }
            done
          done
          echo "[OK] 三 profile 均含 §5/§6/§7"

      # 三章成书端到端（ADR-01 全书层，2026-11-01 批次 B5）：
      # book init → 逐章 assemble → check_book --strict（5.1–5.5）→ build_book（合稿 md+docx）。
      # 量化标准：正向 exit 0；三个负向（删 frontmatter / 术语两写法 / 字数偏离 15%）必须 exit≠0。
      # 判据共源：5.3 复用 check_manuscript、5.4 复用 check_cross_chapter、版式常量复用 build_manuscript。
      - name: 三章成书端到端（check_book 正负双向 + build_book 合稿）
        run: |
          set -e
          WR=/tmp/stt-book
          rm -rf "$WR"; mkdir -p "$WR/章节"
          # ① 夹具：三章同正文（净字数一致），先写 draft 再按实测回写字数目标
          python3 - <<'PY'
          import pathlib, sys
          sys.path.insert(0, "scripts")
          from count_net_words import count_net_words
          wr = pathlib.Path("/tmp/stt-book")
          body_tpl = """# 第{no}章 测试章节

          ## {no}.1 概述

          这是本章概述内容，用于端到端冒烟测试。[实]（PMID:38960123）

          ## {no}.2 小结

          本章小结内容，同样带可检索锚。[实]（PMID:38960123）

          ## 校稿结论

          - **结论**：可交付
          - **修订计数**：插入 0 处 / 删除 0 处
          - **遗留待办**：无

          ## 参考文献

          [1] 作者. 题名[J]. 刊名, 2020, 1(1): 1-2. (PMID:38960123)
          """
          # 先测净字数（frontmatter 不计）
          probe = body_tpl.format(no=1)
          net = count_net_words(probe)["net_final"]
          for ch, no in (("ch01", 1), ("ch02", 2), ("ch03", 3)):
              d = wr / "章节" / ch
              d.mkdir(parents=True, exist_ok=True)
              fm = (f"---\n教材名: 测试教材\n章节号: {ch}\n章节标题: 测试章节\n"
                    f"字数目标: {net}\n实际净字数: {net}\n版本: R1\n学科profile: veterinary\n---\n\n")
              (d / "draft.md").write_text(fm + body_tpl.format(no=no), encoding="utf-8")
              (d / "review").mkdir(exist_ok=True)
              (d / "review" / "r3_verification_log.md").write_text(
                  "| 位置 | 标识符 | 结果 | 动作 |\n|------|--------|------|------|\n"
                  "| §1.1 | PMID:38960123 | 通过 | 保留 |\n| §1.2 | PMID:38960123 | 通过 | 保留 |\n",
                  encoding="utf-8")
          print("夹具就绪，每章净字数:", net)
          with open("/tmp/stt-book-net.txt", "w") as f:
              f.write(str(net))
          PY
          NET=$(cat /tmp/stt-book-net.txt)
          # ② book init（总预算 = 3×净字数 → 5.1 字数判定天然达标）
          python3 scripts/progress.py --work-root "$WR" book init \
            --textbook 测试教材 --chapters ch01,ch02,ch03 --word-budget $((NET * 3))
          # ③ 逐章 assemble（交付 md + docx + 溯源表）
          for ch in ch01 ch02 ch03; do
            python3 scripts/build_manuscript.py --work-root "$WR" --chapter "$ch" --assemble >/dev/null
          done
          # ④ 正向：check_book --strict 必须 exit 0
          python3 scripts/check_book.py --work-root "$WR" --strict
          echo "[OK] check_book 正向 exit 0（5.1–5.5 全过）"
          # ⑤ 全书装配：合稿 md + docx（TOC 域 / 连续页码 / 参考文献合并 / 图号全书序）
          python3 scripts/build_book.py --work-root "$WR" --report "$WR/book_report.json"
          test -f "$WR/交付/测试教材_合稿.md"
          test -f "$WR/交付/测试教材.docx"
          # ⑥ 合稿四要素：可开 + TOC 域 + 单节页码 + 参考文献去重合并（三章同 PMID → 仅 1 条）
          WR="$WR" python3 - <<'PY'
          import os, re, zipfile
          from docx import Document
          p = os.path.join(os.environ["WR"], "交付", "测试教材.docx")
          Document(p)  # 可开
          xml = zipfile.ZipFile(p).read("word/document.xml").decode()
          assert re.search(r'<w:instrText[^>]*>[^<]*TOC', xml), "合稿 docx 无 TOC 域"
          assert xml.count("<w:sectPr") == 1, "sectPr != 1（页码将分节重启）"
          merged = open(os.path.join(os.environ["WR"], "交付", "测试教材_合稿.md"),
                        encoding="utf-8").read()
          refs = re.findall(r"^\[\d+\] ", merged, re.M)
          assert len(refs) == 1, f"参考文献应去重合并为 1 条，实际 {len(refs)}"
          assert "第1章" in merged and "第3章" in merged, "合稿缺章"
          print("[OK] 合稿四要素：可开 / TOC 域 / 单节页码 / 参考文献去重合并")
          PY
          # ⑦ 负向①：删 ch02 交付 md frontmatter → 5.3 必须拦（exit≠0）
          python3 - <<'PY'
          import pathlib, re
          p = next(pathlib.Path("/tmp/stt-book/交付").glob("*_ch02.md"))
          t = p.read_text(encoding="utf-8")
          p.write_text(re.sub(r"\A---\s*\n.*?\n---\s*\n", "", t, flags=re.S), encoding="utf-8")
          PY
          if python3 scripts/check_book.py --work-root "$WR" --strict 2>/dev/null; then
            echo "::error::负向①失败：删 frontmatter 未被 5.3 拦截"; exit 1
          fi
          echo "[OK] 负向①：5.3 拦截缺 frontmatter 章"
          # ⑧ 负向②：ch02 写入术语别名「禽流行性感冒」→ 5.4 必须拦
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("/tmp/stt-book/交付/教材_ch02.md")
          t = p.read_text(encoding="utf-8")
          p.write_text(t.replace("这是本章概述内容", "这是禽流行性感冒相关内容"), encoding="utf-8")
          PY
          if python3 scripts/check_book.py --work-root "$WR" --strict 2>/dev/null; then
            echo "::error::负向②失败：术语两写法未被 5.4 拦截"; exit 1
          fi
          echo "[OK] 负向②：5.4 拦截术语别名"
          # ⑨ 负向③：全书字数目标改小 15%+ → 5.1 必须拦
          python3 - <<'PY'
          import os, pathlib, re
          net = int(open("/tmp/stt-book-net.txt").read())
          p = pathlib.Path("/tmp/stt-book/运行态/book-spec.md")
          t = p.read_text(encoding="utf-8")
          shrunk = int(net * 3 * 0.85) - 1   # 偏离 >5%（5.1 阈值）且 ≈15%
          p.write_text(re.sub(r"^total_word_budget: \d+", f"total_word_budget: {shrunk}",
                              t, flags=re.M), encoding="utf-8")
          PY
          if python3 scripts/check_book.py --work-root "$WR" --strict 2>/dev/null; then
            echo "::error::负向③失败：字数偏离未被 5.1 拦截"; exit 1
          fi
          echo "[OK] 负向③：5.1 拦截字数偏离"
          echo "[OK] 三章成书端到端正负双向全部通过"

