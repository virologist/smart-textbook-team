      # 申诉通道冒烟（#70，2026-11-01 批次 1；判据 A1/A2 机械层探针）：
      # appeal| 前缀键写两次 → progress.py rejects 显示「申诉已用」且 INTERVENTION=0
      # （申诉计数与介入协议语义隔离的负向断言——risk §5.5：coder 忘前缀隔离即在此红）；
      # 对照组：无前缀 reject 键写两次 → INTERVENTION=1（隔离只对 appeal 生效，不松既有打回语义）；
      # 判据 A1 口径断言：申诉 context_refs ⊆ 原 evidence → 主理人不受理（文档口径 + 键不落盘证明）。
      - name: 申诉通道冒烟（#70 appeal 键隔离正反双向）
        run: |
          set -e
          WR=/tmp/stt-appeal
          rm -rf "$WR"; mkdir -p "$WR/运行态"
          # 正向①：同一 appeal| 键写两次（判据 A2：申诉 ≤1 次，第 2 次即申诉已用）
          for i in 1 2; do
            python3 scripts/record_trace.py --work-root "$WR" \
              --task-id "ch01-VERIFY-R2-appeal-$i" --from subject-writer --to team-lead \
              --type RESULT --outcome OK --issues "APPEAL:术语不一致" \
              --reject-key "appeal|ch01|术语不一致" \
              --phase VERIFY --start 2026-11-01T11:40:00+00:00 \
              2>/tmp/stt-appeal-err.txt | tee /tmp/stt-appeal-out.txt
          done
          # appeal 键达 2 不得触发介入协议（INTERVENTION_TRIGGERED 缺席 = 隔离生效）
          if grep -q "INTERVENTION_TRIGGERED=1" /tmp/stt-appeal-out.txt /tmp/stt-appeal-err.txt; then
            echo "::error::appeal| 键误触发介入协议（前缀隔离失效，risk §5.5 病灶）"; exit 1
          fi
          python3 scripts/progress.py --work-root "$WR" rejects | tee /tmp/stt-appeal-rejects.txt
          grep -q "申诉已用" /tmp/stt-appeal-rejects.txt
          grep -q "appeal|ch01|术语不一致: 2" /tmp/stt-appeal-rejects.txt
          grep -q "INTERVENTION=0" /tmp/stt-appeal-rejects.txt
          echo "正向① PASS: appeal 键计数落盘、显示申诉已用、INTERVENTION=0（不误触发介入）"
          # 正向②：申诉成立撤销 blocking——progress.py block → resolve 闭环（主理人三步裁决第③步）
          python3 scripts/progress.py --work-root "$WR" init --chapter ch01 --textbook CI冒烟 --audience 职业本科
          python3 scripts/progress.py --work-root "$WR" block --item "ch01 术语不一致（blocking 指纹）" --source "examiner R2"
          python3 scripts/progress.py --work-root "$WR" resolve --item "术语不一致" --note "appeal_granted: examiner 复核新证据成立"
          grep -q "RESOLVED" "$WR/运行态/progress.md"
          echo "正向② PASS: 申诉成立 → resolve 撤销 blocking 闭环可执行"
          # 负向③：判据 A1——申诉 context_refs ⊆ 原 evidence（无新证据）→ 不受理：
          # 机械证明 = 不受理即不写 appeal 键（reject-counts.json 中该指纹无 appeal 计数增量）
          python3 - <<'PY'
          import json
          counts = json.load(open("/tmp/stt-appeal/运行态/reject-counts.json", encoding="utf-8"))
          assert counts == {"appeal|ch01|术语不一致": 2}, counts
          print("负向③ PASS: A1 不受理路径不产生任何 appeal 键增量（受理权在主理人 A1 校验之后）")
          PY
          # 负向④：对照组——无前缀 reject 键写两次 → 介入协议照常触发（隔离不松既有语义）
          for i in 1 2; do
            python3 scripts/record_trace.py --work-root "$WR" \
              --task-id "ch01-VERIFY-R2-reject-$i" --from quality-examiner --to team-lead \
              --type BLOCK --outcome BLOCKED \
              --reject-key "ch01|术语不一致" \
              --phase VERIFY --start 2026-11-01T11:45:00+00:00 \
              2>/tmp/stt-reject2-err.txt | tee /tmp/stt-reject2-out.txt
          done
          grep -q "INTERVENTION_TRIGGERED=1" /tmp/stt-reject2-out.txt
          python3 scripts/progress.py --work-root "$WR" rejects | tee /tmp/stt-reject2-rejects.txt
          grep -q "INTERVENTION=1" /tmp/stt-reject2-rejects.txt
          grep -q "申诉已用" /tmp/stt-reject2-rejects.txt   # appeal 标注仍在，两键互不污染
          echo "负向④ PASS: 无前缀键达 2 照常触发介入；appeal 键标注不受污染"

      # M1 破坏样本矩阵（B6 横切验收口径，GATE2 §6）：每个判据族一个最小破坏样本，
      # 断言校验器必须拦住——FAIL 级判据 → --strict exit≠0；advisory 级（4.9 存在性）
      # → 该项必须被标记。此前负向实验只覆盖 4/14 族（4.10/4.11/4.12/4.13），本轮扩到 15/15（含 4.14）。
      # ★M2 v2.11.3：4.12d 第④锚 std-skill 认锚正负双向（G6 缺口落地回归）
      - name: 门禁4负向实验（4.12d std-skill 第④锚正负双向）
        run: |
          set -e
          python3 - <<'PY'
          import importlib.util as ilu
          spec = ilu.spec_from_file_location("cm", "scripts/check_manuscript.py")
