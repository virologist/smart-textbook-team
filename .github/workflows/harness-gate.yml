          python3 scripts/build_manuscript.py --work-root "$WR" --chapter ch01 --assemble >/dev/null
          # 基线必须干净（M2「原场景不退化」：破坏样本前先证明基线绿）
          python3 scripts/check_manuscript.py --work-root "$WR" --chapter ch01 --strict
          python3 - <<'PY'
          import json, re, shutil, subprocess, sys
          from pathlib import Path

          BASE = Path("/tmp/stt-m1")
          MD_REL = Path("交付/教材_ch01.md")

          def run_check(wr, extra=()):
              p = subprocess.run(
                  [sys.executable, "scripts/check_manuscript.py",
                   "--work-root", str(wr), "--chapter", "ch01", "--json", "--strict", *extra],
                  capture_output=True, text=True)
              items = {i["id"]: i for i in json.loads(p.stdout)["items"]}
              return p.returncode, items

          def fresh(tag):
              dst = Path(f"/tmp/stt-m1-{tag}")
              if dst.exists():
                  shutil.rmtree(dst)
              shutil.copytree(BASE, dst)
              return dst

          def edit_md(wr, fn):
              p = wr / MD_REL
              p.write_text(fn(p.read_text(encoding="utf-8")), encoding="utf-8")

          def in_family(item, family):
              return item == family or re.match(rf"^{re.escape(family)}[a-z]", item)

          results = []

          def case(family, tag, expect_fail, mutate, extra=()):
              wr = fresh(tag)
              mutate(wr)
              rc, items = run_check(wr, extra)
              hit = {k: v for k, v in items.items() if in_family(k, family)}
              flagged = any(not v["ok"] for v in hit.values())
              fail_level = any((not v["ok"]) and v["level"] == "FAIL" for v in hit.values())
              ok = (flagged and fail_level and rc != 0) if expect_fail else flagged
              results.append((family, tag, ok, rc, sorted(hit)))

          # ── 15 判据族最小破坏样本 ──
          case("4.0", "frontmatter缺项", True,
               lambda wr: edit_md(wr, lambda t: t.replace("学科profile: veterinary\n", "")))
          case("4.1", "标题跳级", True,
               lambda wr: edit_md(wr, lambda t: t.replace("## 1.1 概述", "### 1.1 概述")))
          case("4.2", "图位缺题注", True,
               lambda wr: edit_md(wr, lambda t: t.replace(
                   "## 1.2 小结", "[图 1-1：补图]\n\n## 1.2 小结")))
          case("4.3", "悬空交叉引用", True,
               lambda wr: edit_md(wr, lambda t: t.replace("[见 §1.2]", "[见 §9.9]")))
          case("4.4", "参考文献断号", True,
               lambda wr: edit_md(wr, lambda t: t.replace("[1] 作者", "[2] 作者")))
          case("4.5", "docx坏zip", True,
               lambda wr: (wr / "交付/教材_ch01.docx").write_bytes(b"\x00garbage\x01"))
          case("4.6", "图未栅格化", True,
               lambda wr: edit_md(wr, lambda t: t.replace(
                   "## 1.2 小结", "[图 1-1：补图]\n\n图 1-1 补图\n\n## 1.2 小结")),
               extra=("--require-raster",))
          case("4.7", "字数偏离", True,
               lambda wr: edit_md(wr, lambda t: t.replace("字数目标: 71", "字数目标: 200")))
          case("4.8", "习题断号", True,
               lambda wr: edit_md(wr, lambda t: t.replace(
                   "## 1.2 小结", "[习题 1-1] [习题 1-3]\n\n## 1.2 小结")))
          case("4.9", "无思政标记", False,   # advisory 级（存在性），按设计不阻断
               lambda wr: None)
          case("4.10", "数据图无notebook", True,
               lambda wr: edit_md(wr, lambda t: t.replace(
                   "## 1.2 小结", "[图 1-1：趋势图]\n\n图 1-1 趋势图\n\n数据来源=试验测定\n\n## 1.2 小结")))
          case("4.11", "禁用写法出现", True,
               lambda wr: edit_md(wr, lambda t: t.replace("结论句", "结论句 AIV")))
          case("4.12", "溯源表缺失", True,
               lambda wr: (wr / "交付/教材_ch01.溯源.md").unlink())
          case("4.13", "孤立修订标记", True,
               lambda wr: edit_md(wr, lambda t: t.replace(
                   "## 校稿结论", "[新句]{.insertion author=\"严正词\" date=\"2026-01-01\"}\n\n## 校稿结论")))
          case("4.14", "R5总分不达标", True,
               lambda wr: (wr / "运行态").mkdir(exist_ok=True) or
               (wr / "运行态/r5-score.json").write_text(json.dumps({
                   "chapter": "ch01", "total": 79.0, "weight_sum": 100, "verdict": "fail",
                   "dims": {"知识严谨性": {"score": 79, "weight": 30, "evidence": ["§1.1"]},
                            "前沿性": {"score": 79, "weight": 15, "evidence": ["§1.1"]},
                            "易懂易学": {"score": 79, "weight": 25, "evidence": ["§1.1"]},
                            "职业教育适配": {"score": 79, "weight": 20, "evidence": ["§1.1"]},
                            "规范性": {"score": 79, "weight": 10, "evidence": ["§1.1"]}}},
                   ensure_ascii=False), encoding="utf-8"))

          bad = [r for r in results if not r[2]]
          for family, tag, ok, rc, hit in results:
              print(f"  {'✓' if ok else '✗'} [{family}] {tag}（exit={rc}, 命中项={hit[:4]}）")
          assert not bad, f"M1 破坏样本未被拦截: {bad}"
          assert len(results) == 15, len(results)
          print("M1 PASS: 15/15 判据族破坏样本全部被拦截（4.9 advisory 级按设计标记不阻断）")
          PY

      # M3 声明↔实现反查（B6）：文档声明「由 X 拦截/由 Y 生成」必须能反查到实现行
      - name: M3 声明与行为解耦校验（check_declaration TECH_DEBT=0）
        run: |
          set -e
          python3 scripts/check_declaration.py --out /tmp/stt-tech-debt.md | tail -4
          python3 - <<'PY'
          import subprocess, sys
          p = subprocess.run([sys.executable, "scripts/check_declaration.py", "--strict"],
                             capture_output=True, text=True)
          assert p.returncode == 0, p.stdout + p.stderr
          assert "TECH_DEBT=0" in p.stdout, p.stdout
          print("M3 PASS: 93 条声明全部可反查（B-12 类虚构职责已被拦截并修正）")
          PY

      # CS 教材章跨学科端到端（ADR-02 判据层学科化，2026-11-01 批次 B3）：
      # 验证「非兽医学科也能跑通」的解耦证据——CS 术语表无 AI 禁用 → 4.11 放行
      # 「人工智能（AI）」；通用百分比数值信号（RE_PERCENT 兜底）→ 3.1 报缺标签
      # （旧实现写死 11 个兽医指标，非兽医学科的百分比数值恒绿，C-05 病灶）。
      - name: CS 教材章跨学科端到端（4.11 放行 + 3.1 缺标签 + 三 profile 断言）
        run: |
          set -e
          WR=/tmp/stt-cs
          rm -rf "$WR"; mkdir -p "$WR/章节/ch01/figures/assets" "$WR/章节/ch01/review" "$WR/交付"
          cat > "$WR/章节/ch01/draft.md" <<'MD'
          ---
          教材名: 计算机导论
          章节号: ch01
          章节标题: 人工智能概述
          字数目标: 60
          实际净字数: 60
          版本: R1
          学科profile: computer-science
          ---

          # 第1章 人工智能概述

          ## 1.1 概述

          人工智能（AI）是计算机科学的分支。

          ## 参考文献

          [1] 作者. 题名[J]. 刊名, 2020, 1(1): 1-2. (PMID:38960123)
          MD
          cat > "$WR/章节/ch01/review/r3_verification_log.md" <<'MD'
          | 位置 | 标识符 | 结果 | 动作 |
          |------|--------|------|------|
          | §1.1 | PMID:38960123 | 通过 | 保留 |
          MD
          echo '结论: 可交付' > "$WR/章节/ch01/review/proofread_revisions.md"
          python3 scripts/build_manuscript.py --work-root "$WR" --chapter ch01 --assemble >/dev/null
          # ① CS「人工智能（AI）」→ 4.11 必须 PASS（AI 非 CS 禁用写法；兽医域 AI 才是禁用）
          python3 scripts/check_manuscript.py --work-root "$WR" --chapter ch01 --json 2>&1 > /tmp/stt-cs.json || true  # ★M8
          python3 - <<'PY'
          import json
          items = {i["id"]: i for i in json.load(open("/tmp/stt-cs.json"))["items"]}
          assert items.get("4.11", {}).get("ok") is True, "CS 4.11 应放行 人工智能（AI）: " + str(items.get("4.11"))
          print("[OK] CS 4.11 放行 人工智能（AI）")
          PY
          # ② 3.1 通用百分比兜底：资产负债率 68.4% 无标签 → 节级自查必须报缺标签
          mkdir -p "$WR/章节/ch01/sections"
          printf '## 1.1 概述\n\n资产负债率 68.4%% 是财务指标示例（无标签）。\n' > "$WR/章节/ch01/sections/1.1.md"
          if python3 scripts/assemble_sections.py --work-root "$WR" --chapter ch01 2>/dev/null; then
            echo "::error::3.1 未拦截无标签百分比数值（68.4% 缺标签却通过节级自查）"
            exit 1
          fi
          echo "[OK] CS 3.1 拦截无标签百分比数值（RE_PERCENT 兜底）"
          # ③ 三 profile 均含 §5/§6/§7（节可标 N/A，但节必须存在）
          for f in references/profiles/veterinary.md references/profiles/computer-science.md references/profiles/law.md; do
            for s in "## 5" "## 6" "## 7"; do
              grep -q "$s" "$f" || { echo "::error::$f 缺 $s 节"; exit 1; }
            done
          done
          echo "[OK] 三 profile 均含 §5/§6/§7"
          # ④ audience-profiles 结构断言（#71 批次 2：学段判据 SSOT 三节在场）
          for s in "## 0. 加载协议" "## 1. 判据表" "## 2. 执行挂点"; do
            grep -q "$s" references/audience-profiles.md || { echo "::error::audience-profiles.md 缺 $s"; exit 1; }
          done
          grep -q "audience:" agents/didactic-architect.md || { echo "::error::architect 缺 audience 声明强制"; exit 1; }
          echo "[OK] audience-profiles 三节在场 + architect audience 声明强制"

      # 三章成书端到端（ADR-01 全书层，2026-11-01 批次 B5）：
      # book init → 逐章 assemble → check_book --strict（5.1–5.5）→ build_book（合稿 md+docx）。
      # 量化标准：正向 exit 0；三个负向（删 frontmatter / 术语两写法 / 字数偏离 15%）必须 exit≠0。
      # 判据共源：5.3 复用 check_manuscript、5.4 复用 check_cross_chapter、版式常量复用 build_manuscript。
      - name: 三章成书端到端（check_book 正负双向 + build_book 合稿）
        run: |
          set -e
          WR=/tmp/stt-book
          rm -rf "$WR"; mkdir -p "$WR/章节"
          # ① 夹具：三章同正文（净字数一致），先写 draft 再按实测回写字数目标
          python3 - <<'PY'
          import pathlib, sys
          sys.path.insert(0, "scripts")
          from count_net_words import count_net_words
          wr = pathlib.Path("/tmp/stt-book")
          body_tpl = """# 第{no}章 测试章节

          ## {no}.1 概述

          这是本章概述内容，用于端到端冒烟测试。[实]（PMID:38960123）

          ## {no}.2 小结

          本章小结内容，同样带可检索锚。[实]（PMID:38960123）

          ## 校稿结论

          - **结论**：可交付
          - **修订计数**：插入 0 处 / 删除 0 处
          - **遗留待办**：无

          ## 参考文献

          [1] 作者. 题名[J]. 刊名, 2020, 1(1): 1-2. (PMID:38960123)
          """
          # 先测净字数（frontmatter 不计）
          probe = body_tpl.format(no=1)
          net = count_net_words(probe)["net_final"]
          for ch, no in (("ch01", 1), ("ch02", 2), ("ch03", 3)):
              d = wr / "章节" / ch
              d.mkdir(parents=True, exist_ok=True)
              fm = (f"---\n教材名: 测试教材\n章节号: {ch}\n章节标题: 测试章节\n"
                    f"字数目标: {net}\n实际净字数: {net}\n版本: R1\n学科profile: veterinary\n---\n\n")
              (d / "draft.md").write_text(fm + body_tpl.format(no=no), encoding="utf-8")
              (d / "review").mkdir(exist_ok=True)
              (d / "review" / "r3_verification_log.md").write_text(
                  "| 位置 | 标识符 | 结果 | 动作 |\n|------|--------|------|------|\n"
                  "| §1.1 | PMID:38960123 | 通过 | 保留 |\n| §1.2 | PMID:38960123 | 通过 | 保留 |\n",
                  encoding="utf-8")
          print("夹具就绪，每章净字数:", net)
          with open("/tmp/stt-book-net.txt", "w") as f:
              f.write(str(net))
          PY
          NET=$(cat /tmp/stt-book-net.txt)
          # ② book init（总预算 = 3×净字数 → 5.1 字数判定天然达标）
          python3 scripts/progress.py --work-root "$WR" book init \
            --textbook 测试教材 --chapters ch01,ch02,ch03 --word-budget $((NET * 3))
          # ③ 逐章 assemble（交付 md + docx + 溯源表）
          for ch in ch01 ch02 ch03; do
            python3 scripts/build_manuscript.py --work-root "$WR" --chapter "$ch" --assemble >/dev/null
          done
          # ④ 正向：check_book --strict 必须 exit 0
          # ★M1 v2.11.3：⑤ 装配后再补跑一次全量 —— 此前 docx 在 check 之后才生成，
          # 5.5 三项（可开/图数一致/字数达标）在端到端里永远走 N/A 短路，「5.1–5.5 全过」
          # 是假命题；现在合稿产物落盘后二次 check 让 5.5 真正执行
          python3 scripts/check_book.py --work-root "$WR" --strict
          echo "[OK] check_book 正向 exit 0（5.1–5.5 全过，5.5 此时 N/A 属装配前预期）"
          # ⑤ 全书装配：合稿 md + docx（TOC 域 / 连续页码 / 参考文献合并 / 图号全书序）
          python3 scripts/build_book.py --work-root "$WR" --report "$WR/book_report.json"
          test -f "$WR/交付/测试教材_合稿.md"
          test -f "$WR/交付/测试教材.docx"
          # ⑤b ★M1：装配后全量复检 —— 5.5 三项首次真正执行（docx 在位不再 N/A）
          python3 scripts/check_book.py --work-root "$WR" --strict
          echo "[OK] 装配后 check_book 复检 exit 0（5.5 可开/图数/字数实跑通过）"
          # ⑥ 合稿四要素：可开 + TOC 域 + 单节页码 + 参考文献去重合并（三章同 PMID → 仅 1 条）
          WR="$WR" python3 - <<'PY'
          import os, re, zipfile
          from docx import Document
          p = os.path.join(os.environ["WR"], "交付", "测试教材.docx")
          Document(p)  # 可开
          xml = zipfile.ZipFile(p).read("word/document.xml").decode()
          assert re.search(r'<w:instrText[^>]*>[^<]*TOC', xml), "合稿 docx 无 TOC 域"
          assert xml.count("<w:sectPr") == 1, "sectPr != 1（页码将分节重启）"
          merged = open(os.path.join(os.environ["WR"], "交付", "测试教材_合稿.md"),
                        encoding="utf-8").read()
          refs = re.findall(r"^\[\d+\] ", merged, re.M)
          assert len(refs) == 1, f"参考文献应去重合并为 1 条，实际 {len(refs)}"
          assert "第1章" in merged and "第3章" in merged, "合稿缺章"
          print("[OK] 合稿四要素：可开 / TOC 域 / 单节页码 / 参考文献去重合并")
          PY
          # ⑦ 负向①：删 ch02 交付 md frontmatter → 5.3 必须拦（exit≠0）
          python3 - <<'PY'
          import pathlib, re
          p = next(pathlib.Path("/tmp/stt-book/交付").glob("*_ch02.md"))
          t = p.read_text(encoding="utf-8")
          p.write_text(re.sub(r"\A---\s*\n.*?\n---\s*\n", "", t, flags=re.S), encoding="utf-8")
          PY
          if python3 scripts/check_book.py --work-root "$WR" --strict 2>/dev/null; then
            echo "::error::负向①失败：删 frontmatter 未被 5.3 拦截"; exit 1
          fi
          echo "[OK] 负向①：5.3 拦截缺 frontmatter 章"
          # ⑧ 负向②：ch02 写入术语别名「禽流行性感冒」→ 5.4 必须拦
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("/tmp/stt-book/交付/教材_ch02.md")
          t = p.read_text(encoding="utf-8")
          p.write_text(t.replace("这是本章概述内容", "这是禽流行性感冒相关内容"), encoding="utf-8")
          PY
          if python3 scripts/check_book.py --work-root "$WR" --strict 2>/dev/null; then
            echo "::error::负向②失败：术语两写法未被 5.4 拦截"; exit 1
          fi
          echo "[OK] 负向②：5.4 拦截术语别名"
          # ⑨ 负向③：全书字数目标改小 15%+ → 5.1 必须拦
          python3 - <<'PY'
          import os, pathlib, re
          net = int(open("/tmp/stt-book-net.txt").read())
          p = pathlib.Path("/tmp/stt-book/运行态/book-spec.md")
          t = p.read_text(encoding="utf-8")
          shrunk = int(net * 3 * 0.85) - 1   # 偏离 >5%（5.1 阈值）且 ≈15%
          p.write_text(re.sub(r"^total_word_budget: \d+", f"total_word_budget: {shrunk}",
                              t, flags=re.M), encoding="utf-8")
          PY
          if python3 scripts/check_book.py --work-root "$WR" --strict 2>/dev/null; then
            echo "::error::负向③失败：字数偏离未被 5.1 拦截"; exit 1
          fi
          echo "[OK] 负向③：5.1 拦截字数偏离"
          echo "[OK] 三章成书端到端正负双向全部通过"

      # 同步义务: tests/test_smart_textbook_team.py 与 tb-writer 仓库副本保持同源
      # (SSOT 在包内, tb-writer 侧为评测适配器; 任一侧修改须同步另一侧)
