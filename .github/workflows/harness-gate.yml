          rm -f "$WR/运行态/r5-score.json"
          python3 - <<'PY'
          import importlib.util as ilu, pathlib
          spec = ilu.spec_from_file_location("cm", "scripts/check_manuscript.py")
          cm = ilu.module_from_spec(spec); spec.loader.exec_module(cm)
          r = cm.Result()
          cm.check_r5_score(pathlib.Path("/tmp/stt-r5"), "ch01", r)
          bad = [i for i in r.items if not i["ok"] and i["level"] == "FAIL"]
          assert not bad, bad
          print("正向⑦ PASS: 缺 r5-score.json → 4.14 N/A 不阻塞")
          PY
          # 打回计数：同一 reject-key 两次 → 计数达 2，介入协议自动触发
          # ★L5 v2.11.2：B2 时延门禁后须补 --phase/--start（同 step10 信封段根因）
          for i in 1 2; do
            python3 scripts/record_trace.py --work-root "$WR" \
              --task-id "ch01-VERIFY-R2-$i" --from quality-examiner --to team-lead \
              --type BLOCK --outcome BLOCKED \
