          pos = ["[实]（std-skill:出版社规范:交稿格式）", "[实]（std-skill:gb:图表规范#表2）"]
          neg = ["[实]（std-skill::条目）", "[实]（std-skill:名）", "裸 [实]"]
          for s in pos:
              assert cm._has_retrievable_anchor(s), f"④锚应认: {s}"
          for s in neg:
              assert not cm._has_retrievable_anchor(s), f"④残缺应拒: {s}"
          # 回归：既有 ①②③ 形态判定不变
          assert cm._has_retrievable_anchor("[实]（本地:a.md#L3）")
          assert not cm._has_retrievable_anchor("[实]（本地:a.md）")
          assert cm._has_retrievable_anchor("[实]（ima:kb1:doc）")
          print("[OK] 4.12d std-skill 第④锚正负双向通过（含三形态回归）")
