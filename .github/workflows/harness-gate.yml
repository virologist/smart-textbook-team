          PY
          # Q2 枚举断言（D-01 终审整改，#71）：非法 audience 值必须 exit 2 不落盘；
          # 四档合法值照常落盘；book init 空值放行（回落语义在 SSOT §0，不在本层静默替默认）
          WRQ=/tmp/stt-q2
          rm -rf "$WRQ"; mkdir -p "$WRQ"
