          # 第1章 M1 基线章

          ## 1.1 概述

          本句为冒烟正文 [实]（PMID:38960123）。交叉引用 [见 §1.2]。[原表述]{.deletion author="严正词" date="2026-10-31"}[修订表述]{.insertion author="严正词" date="2026-10-31"}

