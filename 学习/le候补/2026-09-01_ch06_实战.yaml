# ch06 实战 LEARN 候补（2026-09-01，W1 缩影试跑）
# 来源：trace.jsonl + review/round1_report.md 真实观察
- date: 2026-09-01
  chapter: ch06
  signal_type: 核验失败
  observed_pattern: |
    检索员在提取阶段将 PMID:32382850 的 "isolated in China in 2012" 自行补全为
    「山东分离」（摘要无地名，作者单位为北京的中国兽药典委员会），writer 照抄进
    正文打 [实] 标签。错误源自检索员的摘要提取层而非 writer 编造——scout 的
    「结构化提取」步骤缺乏「逐字核对数据点 vs 原文」的防过度补全规则。
  proposed_rule: |
    literature-scout 结构化提取后增加自检：条目中每个具体限定词（地名/年份/宿主/
    数值）必须在来源摘要中逐字可定位，不可定位的限定词删除或降为 [估]。
  target: literature-scout.md
  priority: P1
- date: 2026-09-01
  chapter: ch06
  signal_type: 核验失败
  observed_pattern: |
    R3 批量核验 5 PMID 仅 1 次 MCP 调用即完成（约 45s），远低于 evo 前实测的
    458s 瓶颈——"分批 ≤10 条 + 批内并行" 在小引用量场景天然满足；但定义中
    「R3 每批 ≤60s」的预算在 MCP 一次批量返回时无分层计时 guidance，实际无法
    按批计时。
  proposed_rule: |
    quality-examiner 延迟预算补充：MCP 批量调用（单次多 PMID）时 R3 计时按整批
    计而非逐条计，预算口径同步改为「每批调用 ≤60s」。
  target: quality-examiner.md
  priority: P2
- date: 2026-09-01
  chapter: ch06
  signal_type: 反复打回点
  observed_pattern: |
    draft frontmatter 引用统计写「[实] 7 条」，但 R3 按正文位置核验为 8 处
    （一条数据双源引用计 2 处）——统计口径未定义（按标注处数还是按唯一数据点数）
    导致 writer 自报数与 examiner 核验数天然对不上。
  proposed_rule: |
    subject-writer 引用统计口径显式化：按「正文 [标签] 出现处数」计数并注明唯一
    标识符数，如「[实] 8 处（唯一 PMID 5 个）」。
  target: subject-writer.md
  priority: P2
