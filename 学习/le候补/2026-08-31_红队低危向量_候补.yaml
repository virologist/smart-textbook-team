# LEARN 候补池 — 来源：evo-8 红队对抗遗留（非章节生产，chapter=self-evo）
# 规则：≥3 条候选且用户 ack 后合并入 evo 轮；解决后就地标 RESOLVED + Resolution
- date: 2026-08-31
  chapter: self-evo
  signal_type: 红队低危向量
  observed_pattern: 双成员各自 BLOCK 等对方、或 blocking_open 非空但责任成员预算耗尽——无解锁路径，全队挂起
  proposed_rule: BLOCK 依赖图成环（A等B且B等A）→ 编排者强制裁决；blocking_open 悬空超过 1 个调度周期 → 编排者必须介入（介入协议或升级用户），禁止悬空等待
  target: agent-harness-protocol
  priority: P2
  status: RESOLVED
  resolution: evo-9 已落地（agent-harness-protocol v1.2 第 4-7 条 / team-lead 计数键）
